name: 채권 대시보드 매일 업데이트

on:
  schedule:
    # 평일 오전 9시 KST (UTC 00:00) + 오후 4시 KST (UTC 07:00)
    - cron: '0 0 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # GitHub 웹에서 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests openpyxl

      - name: 대시보드 업데이트
        run: python update.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html kofia_cache.json debt_positions.json debt_history.json
          git diff --staged --quiet || git commit -m "Update $(date +'%Y-%m-%d')"
          git pull --no-rebase -X ours origin main && git push
